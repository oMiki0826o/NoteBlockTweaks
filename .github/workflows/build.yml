# File: build.yml
# Modification: 2026-10-10 - Build Fabric jar and run pitch plus clipboard tests.
name: Build
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Test pure pitch logic
        run: |
          mkdir -p /tmp/noteblock-test
          javac -encoding UTF-8 -d /tmp/noteblock-test \
            src/main/java/dev/miki/noteblocktweaks/tuning/PitchMath.java \
            src/main/java/dev/miki/noteblocktweaks/tuning/NotePitchClipboard.java \
            src/test/java/dev/miki/noteblocktweaks/tuning/PitchMathTest.java \
            src/test/java/dev/miki/noteblocktweaks/tuning/NotePitchClipboardTest.java
          java -cp /tmp/noteblock-test dev.miki.noteblocktweaks.tuning.PitchMathTest
          java -cp /tmp/noteblock-test dev.miki.noteblocktweaks.tuning.NotePitchClipboardTest
      - name: Build remapped mod jar
        run: gradle build --no-daemon
      - name: Upload distributable
        uses: actions/upload-artifact@v4
        with:
          name: NoteBlockTweaks-mc1.21.8
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
