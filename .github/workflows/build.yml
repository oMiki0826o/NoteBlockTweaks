# File: build.yml
# Modification: 2026-11-04 - Validate tuner GUI regression, build distributable and release from main.
name: Build

on:
  push:
    branches: [main, 'fix/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'write' || 'read' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Test pure pitch logic
        run: |
          mkdir -p /tmp/noteblock-test
          javac -encoding UTF-8 -d /tmp/noteblock-test \
            src/main/java/dev/miki/noteblocktweaks/tuning/PitchMath.java \
            src/main/java/dev/miki/noteblocktweaks/tuning/NotePitchClipboard.java \
            src/test/java/dev/miki/noteblocktweaks/tuning/PitchMathTest.java \
            src/test/java/dev/miki/noteblocktweaks/tuning/NotePitchClipboardTest.java
          java -cp /tmp/noteblock-test dev.miki.noteblocktweaks.tuning.PitchMathTest
          java -cp /tmp/noteblock-test dev.miki.noteblocktweaks.tuning.NotePitchClipboardTest
      - name: Verify GUI blur regression
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src = Path('src/main/java/dev/miki/noteblocktweaks/gui/NoteTunerScreen.java').read_text()
          render = src.split('public void render(DrawContext context, int mouseX, int mouseY, float delta) {', 1)[1]
          render = render.split('@Override', 1)[0]
          assert 'renderBackground(' not in render, 'Tuner must not repeat screen background blur'
          assert 'context.fill(' in render, 'Tuner must keep a non-blurring background overlay'
          PY
      - name: Build and verify remapped mod jar
        run: |
          gradle clean check build --no-daemon
          mkdir -p dist
          find build/libs -maxdepth 1 -name 'noteblock-tweaks-*.jar' ! -name '*-sources.jar' -exec cp {} dist/ \;
          test "$(find dist -maxdepth 1 -name '*.jar' | wc -l | tr -d ' ')" = "1"
          jar tf dist/*.jar | grep -q 'fabric.mod.json'
          jar tf dist/*.jar | grep -q 'dev/miki/noteblocktweaks/gui/NoteTunerScreen.class'
      - name: Upload distributable
        uses: actions/upload-artifact@v4
        with:
          name: NoteBlockTweaks-mc1.21.8
          path: dist/*.jar
          if-no-files-found: error
      - name: Calculate release tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: release
        shell: bash
        run: |
          version="$(sed -n 's/^mod_version=//p' gradle.properties)"
          test -n "$version"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - name: Publish GitHub Release and JAR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: NoteBlock Tweaks ${{ steps.release.outputs.tag }}
          generate_release_notes: true
          files: dist/*.jar
          fail_on_unmatched_files: true
